[package]
name = "forge-core"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ts-rs = "12"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["io-util", "fs", "time", "sync", "rt", "process", "macros"] }
toml = "0.8"
dirs = "5"
tracing = "0.1"
async-trait = "0.1"
# F-587: `secrecy::SecretString` is the at-boundary type for credential
# values. `SecretBox<str>` zeroes its backing buffer on drop and refuses to
# `Debug`-print the value; we lean on both. v0.10 is the current line.
secrecy = "0.10"
# F-585: `url_safety::check_url` (formerly `forge-mcp::transport::ssrf::check_url`,
# F-346) lifted here so both forge-mcp and forge-providers can reuse the SSRF
# guard without forge-providers gaining a wrong-direction dep on forge-mcp.
url = "2"
# F-644: `http::secure_client_builder` houses a `reqwest::dns::Resolve` impl
# that re-checks every resolved IP against `url_safety` policy, closing the
# DNS-rebinding gap between `check_url` and the actual TCP connect. We pull
# reqwest with only the rustls-tls backend — no `json`, `stream`, or other
# feature flags — because callers compose their own builders on top of this
# helper and bring their own feature requirements.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# F-587: Platform-gated keyring backends. Linux uses Secret Service over
# DBus directly; macOS uses the system Keychain via `security-framework`;
# Windows falls back to the cross-platform `keyring` crate (which wraps
# DPAPI / Credential Manager). Each is only pulled on its target so the
# build dependency footprint stays minimal per host.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = "3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
criterion = "0.5"

[[bench]]
name = "event_log_and_superseded"
harness = false

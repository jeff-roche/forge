[package]
name = "forge-providers"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[features]
# F-586: enable the `RuntimeProvider::Mock` variant for callers outside the
# `forge-providers` test target (e.g. `forge-session::tests::provider_swap`,
# any future cross-crate integration suite). Production binaries leave this
# off; the `Mock` arm vanishes from the enum, so the dashboard's IPC layer
# cannot dispatch to it even via direct `SwappableProvider::swap` from
# another crate.
testing = []

[dependencies]
anyhow = "1"
bytes = "1"
dirs = "6.0.0"
forge-core = { path = "../forge-core" }
futures = "0.3"
# F-749: parse the HTTP-date form of the `Retry-After` response header on 429
# rate-limit replies. Already present transitively via reqwest's hyper
# dependency tree; declared directly here for first-class use.
httpdate = "1"
# `parking_lot::Mutex` for `MockProvider` interior state — its guards are not
# poisoned on holder-thread panic, so a panicking test does not cascade into
# every subsequent `.lock()` call. Already present transitively via reqwest's
# dependency tree; declared here for direct use.
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# SEC-1 (#702): `secrecy::SecretString` for zeroize-on-drop storage of the
# `CustomOpenAiProvider` API key. The header value is the only place the
# plaintext bytes leave the secret container — built via `ExposeSecret` at
# the HTTP-header-construction boundary and dropped with the request future.
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# F-593: parse the embedded `data/prices.toml` for cost lookups.
toml = "0.8"
tokio = { version = "1", features = ["fs", "rt", "macros", "time"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
# F-743: synthesize provider-side ids for Ollama tool calls (Ollama does not
# assign ids on the wire; the orchestrator round-trips whatever non-empty
# string the provider emits).
uuid = { version = "1", features = ["v4"] }
# F-682: latency / failure-mode attribution via `#[instrument]` on each
# provider's `chat()` entry. Provider-side logs are useful for ops
# triage even with no exporter wired — `tracing-subscriber`'s
# fmt-layer surfaces them when set up by the host binary.
tracing = "0.1"

[dev-dependencies]
# F-744: leak-audit test needs `chrono` for constructing `Event` variants
# carrying `DateTime<Utc>` fields without depending on the orchestrator.
chrono = "0.4"
# F-744: compile-time negative trait assertions — pin the no-`Display` /
# no-`Serialize` posture of `ProviderAuth` so a future refactor that
# accidentally derives either trait fails to build rather than silently
# leaks the credential through string conversion or JSON.
static_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time"] }
futures = "0.3"
# F-744: leak-audit test asserts `forge_core::Event` serialisation never
# embeds a credential — constructed directly in the test to avoid pulling
# the orchestrator's transitive deps into the provider test target.
tracing = "0.1"
# F-744: capture every `tracing` event emitted on the chat path so the
# leak-audit test (`tests/auth_seam.rs`) can grep the buffer for the
# sentinel credential.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
wiremock = "0.6"

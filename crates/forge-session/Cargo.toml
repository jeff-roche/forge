# F-608 step 6: orchestrator-side sidecar credential push contract +
# log-leak audit. Asserts the credential value never appears in
# captured tracing output at any level.
[[test]]
name = "credentials_sidecar_push"
path = "tests/credentials_sidecar_push.rs"

[[test]]
name = "provider_swap"
path = "tests/provider_swap.rs"

# F-608 step 4: SidecarSupervisor acceptance tests. Spawns the
# `forged-agent` binary under cargo's `CARGO_BIN_EXE_forged-agent`
# rendezvous to drive a real handshake → run → shutdown lifecycle.
[[test]]
name = "sidecar_supervisor"
path = "tests/sidecar_supervisor.rs"

# F-608 step 5: BackgroundAgentRegistry sidecar wiring acceptance.
# Drives the env-flag-gated `start()` path end-to-end: forks a real
# `forged-agent` child via the supervisor and asserts an
# `Event::ResourceSample` arrives on the registry bus (closes F-451).
[[test]]
name = "bg_agents_sidecar"
path = "tests/bg_agents_sidecar.rs"

# F-608 step 7: panic-hook crash-dump writer + reader. Drives the
# `forged-agent` binary into a panic and asserts the on-disk dump
# lands at the architected path with the panic message intact.
[[test]]
name = "sidecar_crash_dump"
path = "tests/sidecar_crash_dump.rs"
